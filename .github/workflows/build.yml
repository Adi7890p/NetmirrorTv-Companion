name: Build NetMirror Companion APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: |
        gradle assembleDebug --stacktrace 2>&1 | tee build_output.log

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Console-Log
        path: build_output.log

    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: NetMirror-Companion-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14
