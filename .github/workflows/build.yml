name: Build NetMirror Companion APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: |
        gradle :app:assembleDebug --stacktrace --info

    - name: Upload Debug APK Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: NetMirror-Companion-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14

    - name: Create Public GitHub Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: release-${{ github.run_number }}
        name: "NetMirror Companion APK (Build #${{ github.run_number }})"
        body: |
          ### NetMirror Companion by AK
          - Auto-clicker with glowing visual touch overlay
          - Real-time step-by-step status messages
          - Direct download below
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
